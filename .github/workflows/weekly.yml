name: Episode hebdomadaire

on:
  schedule:
    - cron: "0 5 * * 1"   # chaque lundi à 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  episode:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - name: Générer l'épisode
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: python -m vetpod run
      - name: Publier
        run: |
          git config user.name "vetpod-bot"
          git config user.email "vetpod-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Épisode du $(date +%F)"
          git push
